<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Counter</title>
    </head>
    <body>
        <h1 id="counter">0</h1>

        <button id="increase">Increase</button>

        <script>
            let count = 0;

            document.querySelector("#increase").addEventListener("click", function() {
                count++;

                document.querySelector("#counter").innerHTML = count;
            });
        </script>
    </body>
</html>
